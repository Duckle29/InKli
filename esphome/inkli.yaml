substitutions:
  name: "inkli"
  friendly_name: "InKli"
  # Keep this as the bare word dev, written exactly like the line below: the publish workflow
  # swaps it for the release tag. Local builds report dev.
  version: dev
  # What the two variants (inkli.yaml and inkli-heatpump.yaml) set differently:
  entry_file: inkli.yaml
  project_name: duckle29.inkli
  # Binary the "hold 6 s" update fetches from the OTA server; each variant has its own
  ota_file: inkli-esp32.ota.bin

# Enable logging
logger:
  level: INFO

# esp32_touch:
#   setup_mode: False

binary_sensor:
  - platform: gpio
    id: btn
    pin:
      number: GPIO32
      inverted: True
      #allow_other_uses: True
      mode:
        input: True
        pullup: True
    # Hold-progress bar: remember when the press started. The interval below
    # redraws the display while held and the page lambdas draw the bar.
    on_press:
      - lambda: id(btn_press_ms) = millis();
      - script.stop: full_refresh_when_idle
      # Avoid a full-refresh flash in the middle of a hold
      - lambda: id(disp).set_full_update_every(255);
    on_release:
      - lambda: |-
          id(btn_held_for_ms) = millis() - id(btn_press_ms);
          id(btn_press_ms) = 0;
      - lambda: id(disp).set_full_update_every(60);
      # The bar was on screen, so it has to be erased and any page change shown.
      # E-paper updates requested while the panel is busy are silently dropped
      # by the driver, so this waits for the panel to be idle first.
      - if:
          condition:
            lambda: return id(btn_held_for_ms) >= 500;
          then:
            - script.execute: redraw_after_release
      - script.execute: full_refresh_when_idle
    on_click:
      - min_length: 50ms
        max_length: 350ms
        then:
          - display.page.show_next: disp

      - min_length: 2s
        max_length: 4s
        then:
          - script.execute: toggle_setup

      # 4s: on the config screen while on wifi, forget the wifi credentials. Anywhere else this is
      # still the setup toggle, same as the 2s step.
      - min_length: 4s
        max_length: 6s
        then:
          - if:
              condition:
                and:
                  - display.is_displaying_page: ap_info
                  - wifi.connected:
              then:
                - script.execute: forget_wifi
              else:
                - script.execute: toggle_setup

      - min_length: 6s
        max_length: 60s
        then:
          - display.page.show: page_updating
          - script.wait: refresh_display
          - wait_until:
              condition:
                not:
                  epaper_spi.is_updating: disp
              timeout: 10s
          - ota.http_request.flash:
              md5_url: https://otaserv.mikkel.cc/inkli/${ota_file}.md5
              url: https://otaserv.mikkel.cc/inkli/${ota_file}
          - display.page.show: page_update_failed
          - delay: 10s
          - display.page.show: page_co2_graph

  # - platform: esp32_touch
  #   pin: GPIO33
  #   threshold: 1040
  #   id: touch_test
  #   filters:
  #     - delayed_off: 
  #         milliseconds: 500
  #   on_press: 
  #     then:
  #       - display.page.show_next: disp

sensor:
  - platform: uptime
    id: uptime_sens
    on_value_range:
      - above: 60.0
        then:
          - if:
              condition:
                - display.is_displaying_page: page_setup
              then:
                - display.page.show: page_co2_graph

  - platform: scd30
    id: scd30_hub
    i2c_id: i2c_scd30
    address: 0x61
    update_interval: 30s
    # temperature_offset is set at run time from the two offset numbers below (see apply_temp_offset)
    co2:
      id: scd30_co2
      name: "co2"
      accuracy_decimals: 0
      internal: False
      on_value_range:
        - above: 2000
          then:
            - output.set_level:
                id: led_status
                level: 50%
            - output.turn_on: led_status
        - below: 2000
          then:
            - output.turn_off: led_status

    temperature:
      id: scd30_t
      name: "temperature"
      accuracy_decimals: 2
      internal: False
    humidity:
      name: "humidity"
      id: scd30_rh
      accuracy_decimals: 2
      internal: False
  
  - platform: wifi_signal
    id: wifi_sig
    update_interval: 60s
    filters:
      - lambda: return min(max(2 * (x+100.0), 0.0), 100.0);
  
text_sensor:
  - platform: wifi_info
    ip_address: 
      id: wifi_ip_addr
    ssid: 
      id: wifi_ssid
    mac_address: 
      id: wifi_mac

# external_components:
#   - source: github://pr#8112
#     components:
#       - graph
#     #refresh: 1s

# Example on how to implement a UI section in HA for manual calibration.
# Note: Please enter first a CO2 value before pressing the button.
button:
  - platform: factory_reset
    name: Restart with Factory Default Settings
    
  - platform: template
    name: "CO2 sensor force manual calibration"
    entity_category: "config"
    on_press:
      then:
        - scd30.force_recalibration_with_reference:
            value: !lambda 'return id(co2_cal).state;'

number:
  # Temperature offsets, written to the SCD30 itself (so its humidity reading is corrected too).
  # The radio heats the case, so the right offset differs with wifi on or off: the one matching the
  # current wifi state is applied. Hidden (disabled) in Home Assistant until a user who wants to
  # calibrate enables the entities. The value is kept across reboots.
  - platform: template
    id: temp_offset_wifi
    name: "Temperature offset (wifi connected)"
    icon: "mdi:thermometer-lines"
    entity_category: "config"
    disabled_by_default: true
    restore_value: true
    initial_value: 3.0
    min_value: 0
    max_value: 20
    step: 0.1
    unit_of_measurement: "K"
    mode: box
    optimistic: false
    set_action:
      # The new value is only published after this action, and apply_temp_offset reads the state
      - lambda: id(temp_offset_wifi).publish_state(x);
      - script.execute: apply_temp_offset

  - platform: template
    id: temp_offset_nowifi
    name: "Temperature offset (wifi not connected)"
    icon: "mdi:thermometer-lines"
    entity_category: "config"
    disabled_by_default: true
    restore_value: true
    initial_value: 3.0
    min_value: 0
    max_value: 20
    step: 0.1
    unit_of_measurement: "K"
    mode: box
    optimistic: false
    set_action:
      - lambda: id(temp_offset_nowifi).publish_state(x);
      - script.execute: apply_temp_offset

  - platform: template
    name: "CO2 manual calibration value"
    optimistic: true
    min_value: 350
    max_value: 4500
    initial_value: 400
    step: 1
    id: co2_cal
    icon: "mdi:molecule-co2"
    entity_category: "config"

switch:
  # The SCD30 corrects its own CO2 baseline over time. It assumes it sees fresh air (about 400 ppm) for
  # an hour or so each day, which is wrong in a room that is never aired, so it can be turned off here.
  # The ESPHome driver only sets this once at boot, so the switch sends the sensor command itself
  # (see apply_asc). On by default; the choice is kept across reboots.
  - platform: template
    id: asc_switch
    name: "CO2 automatic calibration"
    icon: "mdi:auto-fix"
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute:
          id: apply_asc
          enable: true
    turn_off_action:
      - script.execute:
          id: apply_asc
          enable: false

# Redraw the display while the button is held so the hold-progress bar moves.
# Only runs between 0.5s and ~6.4s of a hold (the bar is full at 6s).
interval:
  - interval: 200ms
    then:
      - if:
          condition:
            and:
              - lambda: |-
                  if (id(btn_press_ms) == 0) return false;
                  uint32_t held = millis() - id(btn_press_ms);
                  return held >= 500 && held <= 6400;
              # The driver drops updates while the panel is busy, so don't bother rendering then
              - not:
                  epaper_spi.is_updating: disp
          then:
            - component.update: disp

script:
  # What a 2-4 s hold does: go into / out of the setup screens
  - id: toggle_setup
    then:
      - if:
          condition:
            or:
              - display.is_displaying_page: ap_info
              - display.is_displaying_page: page_setup
              - display.is_displaying_page: page_info
          then:
            - display.page.show: page_co2_graph
          else:
            - display.page.show: ap_info
      - if:
          condition:
            and:
              - not:
                - wifi.enabled:
              - display.is_displaying_page: ap_info
          then:
            - wifi.enable:
            # TODO: non-blocking delay - delay: 5min
            - if:
                condition:
                  wifi.connected:
                else:
                  wifi.disable:

  # Forget the stored wifi credentials and restart. The ESPHome wifi component can only overwrite them,
  # not erase them, so empty ones are stored; on the next boot the empty network can never connect, and
  # the setup access point is brought up quickly (see the on_boot hook).
  - id: forget_wifi
    mode: single
    then:
      - lambda: id(wifi_id).save_wifi_sta("", "");
      - display.page.show: page_wifi_forgotten
      - script.wait: refresh_display
      - wait_until:
          condition:
            not:
              epaper_spi.is_updating: disp
          timeout: 10s
      - delay: 1s
      - lambda: App.safe_reboot();

  # Update the display once any refresh in flight has finished. epaper_spi refuses an update
  # requested while it is busy (it logs an error and drops it), so every redraw goes through here.
  - id: refresh_display
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              epaper_spi.is_updating: disp
          timeout: 6s
      - component.update: disp

  # After a hold: erase the bar and show the (possibly new) page
  - id: redraw_after_release
    mode: restart
    then:
      - logger.log:
          format: "Button released after %ums, scheduling redraw"
          args: ['id(btn_held_for_ms)']
      - script.execute: refresh_display

  # A full (flashing) e-paper refresh clears ghosting, but it's distracting while the user
  # is still pressing buttons. So do it once the button has been left alone for 5s.
  # (The driver also still does one every full_update_every updates.)
  - id: full_refresh_when_idle
    mode: restart
    then:
      - delay: 5s
      - wait_until:
          condition:
            not:
              epaper_spi.is_updating: disp
          timeout: 6s
      - epaper_spi.full_update_next: disp
      - component.update: disp

  # Send the SCD30 its automatic self calibration setting (command 0x5306) and read it back. The driver
  # does this once in its own setup(), which always turns it on, so nothing happens here until boot has
  # finished; the boot hook then applies the stored state of the switch.
  - id: apply_asc
    parameters:
      enable: bool
    then:
      - lambda: |-
          if (!id(scd30_ready)) return;
          bool ok = id(scd30_hub).write_command((uint16_t) 0x5306, (uint16_t) (enable ? 1 : 0));
          uint16_t readback = 0xFFFF;
          if (ok) {
            delay(30);  // the SCD30 needs a moment between commands, as in the driver
            ok = id(scd30_hub).get_register((uint16_t) 0x5306, readback, 3);
          }
          if (ok) {
            ESP_LOGI("asc", "Automatic self calibration %s (the sensor reports %u)", enable ? "on" : "off", (unsigned) readback);
          } else {
            ESP_LOGW("asc", "Could not set automatic self calibration to %s", enable ? "on" : "off");
          }

  # Send the SCD30 the temperature offset (command 0x5403, in 0.01 K, never negative) for the current
  # wifi state and read it back. Run at the end of boot, on every wifi connect/disconnect, and when
  # either offset number changes. Does nothing before the sensor has been set up.
  - id: apply_temp_offset
    mode: restart
    then:
      - lambda: |-
          if (!id(scd30_ready)) return;
          const bool wifi_up = id(wifi_id).is_connected();
          float offset = wifi_up ? id(temp_offset_wifi).state : id(temp_offset_nowifi).state;
          if (std::isnan(offset) || offset < 0) offset = 0;
          bool ok = id(scd30_hub).write_command((uint16_t) 0x5403, (uint16_t) lroundf(offset * 100.0f));
          uint16_t readback = 0xFFFF;
          if (ok) {
            delay(30);  // the SCD30 needs a moment between commands, as in the driver
            ok = id(scd30_hub).get_register((uint16_t) 0x5403, readback, 3);
          }
          if (ok) {
            ESP_LOGI("temp_offset", "Temperature offset %.2f K for wifi %s (the sensor reports %.2f K)", offset, wifi_up ? "connected" : "not connected", readback / 100.0f);
          } else {
            ESP_LOGW("temp_offset", "Could not set the temperature offset to %.2f K", offset);
          }

output:
  - platform: ledc
    id: led_status
    pin: GPIO2
    frequency: 19531

# On epaper_spi the old COLOR_ON / COLOR_OFF constants mean white / black ink (the reverse of waveshare_epaper),
# so colours are always written out as Color::BLACK / Color::WHITE. The graph traces need an explicit black too.
color:
  - id: ink
    red: 0%
    green: 0%
    blue: 0%

graph:
  - id: co2_graph
    height: 61
    width: 205
    duration: 
      days: 0
      hours: 12
    border: True
    y_grid: 250
    min_range: 1000
    min_value: 0
    traces:
      - sensor: scd30_co2
        line_type: SOLID
        color: ink
        line_thickness: 2
        continuous: True

  - id: temp_graph
    height: 61
    width: 205
    duration: 
      days: 0
      hours: 12
    border: True
    y_grid: 10
    min_range: 20
    min_value: -20
    traces:
      - sensor: scd30_t
        line_type: SOLID
        color: ink
        line_thickness: 2
        continuous: True

  - id: humi_graph
    height: 61
    width: 205
    duration: 
      days: 0
      hours: 12
    border: True
    y_grid: 10
    min_range: 50
    min_value: 0
    traces:
      - sensor: scd30_rh
        line_type: SOLID
        color: ink
        line_thickness: 2
        continuous: True

font:
  # gfonts://family[@weight]
  - file:
      type: gfonts
      family: Literata
      weight: 700
    id: literata_b
    size: 25
    extras:
      - file: "gfonts://Material+Symbols+Outlined"
        glyphs: [
          "\ue1ff", # Thermometer
          "\uf87e", # Humidity %
          "\ue7b0", # CO2
        ]
  - file:
      type: gfonts
      family: Literata
      weight: 700
    id: literata_med_b
    size: 20
    extras:
      - file: "gfonts://Material+Symbols+Outlined"
        glyphs: [
          "\ue1ff", # Thermometer
          "\uf87e", # Humidity %
          "\ue7b0", # CO2
          "\uf0ef", # Wifi ?
          "\ue1d8", # WiFi Connected 4/4
          "\uebe1", # WiFi Connected 3/4
          "\uebd6", # WiFi Connected 2/4
          "\uebe4", # WiFi Connected 1/4
          "\ue1da", # WiFi Off
        ]

  - file:
      type: gfonts
      family: Literata
      weight: 400
    id: literata_smol
    size: 15
  
  - file:
      type: gfonts
      family: Literata
      weight: 600
    id: literata_less_smol
    size: 14
  
  - file:
      type: gfonts
      family: IBM Plex Mono 
      weight: 600
    id: mono_reg
    size: 20
  
  - file:
      type: gfonts
      family: IBM Plex Mono 
      weight: 600
    id: mono_med
    size: 16
  
  - file:
      type: gfonts
      family: IBM Plex Mono 
      weight: 400
    id: mono_smol
    size: 13

display:
  - platform: epaper_spi
    id: disp
    model: waveshare-2.13in-v3
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin: GPIO4
    data_rate: 2MHz  # what the old driver ran at
    full_update_every: 60
    rotation: 270
    update_interval: 30s
    pages:
      - id: page_setup
        lambda: |-
          const int line_height = 15;
          const int offset = 10;
          std::vector<std::string> lines = {
            "For full functionality",
            "go to:",
            "sche.cc/inklisetup",
            "and connect me to wifi",
            "${version}"
          };

          it.print(0, 0, id(mono_reg), Color::BLACK, "HI! I'm InKli :D");
          
          int line_num = 1;
          for (auto line : lines)
          {
            it.print(0, offset+ line_height*line_num++, id(mono_med), Color::BLACK, line.c_str());
          }
          if (id(draw_hold)) id(draw_hold)(it);
      - id: page_co2_graph 
        lambda: |-
          if( id(wifi_id).is_disabled() )
          {
            it.print(it.get_width()/2, 0, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\ue1da");
            ESP_LOGI("blep", "Wifi off");
          }
          else if( id(wifi_id).is_connected() )
          {
            if( id(wifi_sig).state > 75.0 )
            {
              it.print(it.get_width()/2, 0, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\ue1d8"); // WiFi 4/4
              ESP_LOGI("blep", "Wifi 4/4");
            }
            else if( id(wifi_sig).state > 50.0  )
            {
              it.print(it.get_width()/2, 0, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\uebe1"); // WiFi 3/4
              ESP_LOGI("blep", "Wifi 3/4");
            }
            else if( id(wifi_sig).state > 25.0  )
            {
              it.print(it.get_width()/2, 0, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\uebd6"); // WiFi 2/4
              ESP_LOGI("blep", "Wifi 2/4");
            }
            else // Connected but below 25% strength
            {
              it.print(it.get_width()/2, 0, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\uebe4"); // WiFi 1/4
              ESP_LOGI("blep", "Wifi 1/4");
            }
          }
          else
          {
            it.print(it.get_width()/2, 0, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\uf0ef");
            ESP_LOGI("blep", "Wifi ?");
          }



          it.printf(10, 0, id(literata_b), Color::BLACK, "\ue1ff%.1f°C", id(scd30_t).state);
          it.printf(it.get_width() -10, 0, id(literata_b), Color::BLACK, TextAlign::RIGHT, "\uf87e%.1f%%", id(scd30_rh).state);
          it.printf(it.get_width()/2, 30, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "%.0fppm", id(scd30_co2).state);
          
          const int y_grid = 250;
          const int graph_width = 205;
          const int graph_height = it.get_height()/2;
          const int graph_start_x = it.get_width() - graph_width; // Right adjust graph
          const int graph_start_y = it.get_height() - graph_height; // Bottom adjust graph

          // Generate y-axis labels
          float graph_lim = id(co2_graph).get_graph_limit_max();
          if (std::isnan(graph_lim))
          {
            graph_lim = 0;
          }
          it.printf(it.get_width()-210, graph_start_y, id(literata_smol), Color::BLACK, TextAlign::CENTER_RIGHT, "%.0f", graph_lim);
          it.printf(it.get_width()-210, graph_start_y + graph_height/2, id(literata_smol), Color::BLACK, TextAlign::CENTER_RIGHT, "%.0f", graph_lim/2);

          // Graph
          it.graph(graph_start_x, graph_start_y, id(co2_graph), Color::BLACK);
          if (id(draw_hold)) id(draw_hold)(it);
        

      - id: page_t_graph
        lambda: |-
          // CO2 icon + value, with "ppm" placed straight after the measured value so it can't
          // be overdrawn by a 4 or 5 digit reading. The block starts a little further left than
          // the other pages, and "ppm" drops to the smaller font only if the larger one would run
          // into the humidity reading on the right (the SCD30 tops out at 10000 ppm).
          char co2_txt[24];
          char rh_txt[24];
          snprintf(co2_txt, sizeof(co2_txt), "\ue7b0%.0f", id(scd30_co2).state);
          snprintf(rh_txt, sizeof(rh_txt), "\uf87e%.1f%%", id(scd30_rh).state);
          int co2_w, rh_w, ppm_w, x_off, baseline, height;
          id(literata_b).measure(co2_txt, &co2_w, &x_off, &baseline, &height);
          id(literata_b).measure(rh_txt, &rh_w, &x_off, &baseline, &height);
          id(literata_med_b).measure("ppm", &ppm_w, &x_off, &baseline, &height);
          const int co2_x = 2;
          const int ppm_x = co2_x + co2_w + 3;
          const int rh_left = it.get_width() - 10 - rh_w;
          auto *ppm_font = (ppm_x + ppm_w + 6 <= rh_left) ? id(literata_med_b) : id(literata_smol);
          it.print(co2_x, 0, id(literata_b), Color::BLACK, co2_txt);
          it.print(ppm_x, 0, ppm_font, Color::BLACK, "ppm");
          it.print(it.get_width() -10, 0, id(literata_b), Color::BLACK, TextAlign::RIGHT, rh_txt);
          it.printf(it.get_width()/2, 30, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\ue1ff%.1f°C", id(scd30_t).state);
          
          const int y_grid = 250;
          const int graph_width = 205;
          const int graph_height = it.get_height()/2;
          const int graph_start_x = it.get_width() - graph_width; // Right adjust graph
          const int graph_start_y = it.get_height() - graph_height; // Bottom adjust graph

          // Generate y-axis labels
          float graph_lim = id(temp_graph).get_graph_limit_max();
          if (std::isnan(graph_lim))
          {
            graph_lim = 0;
          }
          it.printf(it.get_width()-210, graph_start_y, id(literata_smol), Color::BLACK, TextAlign::CENTER_RIGHT, "%.0f", graph_lim);
          it.printf(it.get_width()-210, graph_start_y + graph_height/2, id(literata_smol), Color::BLACK, TextAlign::CENTER_RIGHT, "%.0f", graph_lim/2);

          // Graph
          it.graph(graph_start_x, graph_start_y, id(temp_graph), Color::BLACK);
          if (id(draw_hold)) id(draw_hold)(it);
        

      - id: page_rh_graph
        lambda: |-
          // Temperature on the left, CO2 icon + value + "ppm" right-anchored. The value sits a fixed
          // 3 px before "ppm" whatever its width, and "ppm" drops to the smaller font only if the
          // larger one would crowd the temperature. The temperature starts at x=2 (not 10) so a
          // 5 digit reading (the SCD30 tops out at 10000 ppm) still clears even "-10.5°C".
          char temp_txt[24];
          char co2_txt[24];
          snprintf(temp_txt, sizeof(temp_txt), "\ue1ff%.1f°C", id(scd30_t).state);
          snprintf(co2_txt, sizeof(co2_txt), "\ue7b0%.0f", id(scd30_co2).state);
          int temp_w, co2_w, ppm_w, x_off, baseline, height;
          id(literata_b).measure(temp_txt, &temp_w, &x_off, &baseline, &height);
          id(literata_b).measure(co2_txt, &co2_w, &x_off, &baseline, &height);
          id(literata_med_b).measure("ppm", &ppm_w, &x_off, &baseline, &height);
          const int temp_x = 2;
          const int ppm_right = it.get_width() - 2;
          auto *ppm_font = id(literata_med_b);
          if ((ppm_right - ppm_w - 3) - co2_w - (temp_x + temp_w) < 6) {
            ppm_font = id(literata_smol);
            id(literata_smol).measure("ppm", &ppm_w, &x_off, &baseline, &height);
          }
          it.print(temp_x, 0, id(literata_b), Color::BLACK, temp_txt);
          it.print(ppm_right, 0, ppm_font, Color::BLACK, TextAlign::RIGHT, "ppm");
          it.print(ppm_right - ppm_w - 3, 0, id(literata_b), Color::BLACK, TextAlign::RIGHT, co2_txt);
          it.printf(it.get_width()/2, 30, id(literata_med_b), Color::BLACK, TextAlign::CENTER_HORIZONTAL, "\uf87e%.1f%%", id(scd30_rh).state);
          
          const int y_grid = 250;
          const int graph_width = 205;
          const int graph_height = it.get_height()/2;
          const int graph_start_x = it.get_width() - graph_width; // Right adjust graph
          const int graph_start_y = it.get_height() - graph_height; // Bottom adjust graph

          // Generate y-axis labels
          float graph_lim = id(humi_graph).get_graph_limit_max();
          if (std::isnan(graph_lim))
          {
            graph_lim = 0;
          }
          it.printf(it.get_width()-210, graph_start_y, id(literata_smol), Color::BLACK, TextAlign::CENTER_RIGHT, "%.0f", graph_lim);
          it.printf(it.get_width()-210, graph_start_y + graph_height/2, id(literata_smol), Color::BLACK, TextAlign::CENTER_RIGHT, "%.0f", graph_lim/2);

          // Graph
          it.graph(graph_start_x, graph_start_y, id(humi_graph), Color::BLACK);
          if (id(draw_hold)) id(draw_hold)(it);

      - id: ap_info 
        lambda: |-
          if (id(wifi_id).is_connected())
          {
            // The setup access point is not up while connected, so offer to drop the connection instead
            std::string ssid = id(wifi_ssid).state;
            if (ssid.size() > 25) ssid = ssid.substr(0, 23) + "..";
            it.print(0, 0, id(mono_reg), Color::BLACK, "Connected to");
            it.print(0, 22, id(mono_med), Color::BLACK, ssid.c_str());
            it.print(0, 44, id(mono_med), Color::BLACK, "Hold 4s to forget wifi");
          }
          else
          {
            int line_height = 17;
            it.print(0, 0, id(mono_reg), Color::BLACK, "Config mode.");
            it.print(0, line_height*1, id(mono_reg), Color::BLACK, "Connect to:");
            it.print(0, line_height*2, id(mono_reg), Color::BLACK, "SSID: InKli Config");
            it.printf(0, line_height*3, id(mono_reg), Color::BLACK, "Pass  %s", id(ap_password));
          }
          if (id(draw_hold)) id(draw_hold)(it);

      - id: page_wifi_info 
        lambda: |-
          int line_height = 15;
          it.printf(0, 0, id(mono_med), Color::BLACK, "IP: %s", id(wifi_ip_addr).state.c_str());
          it.printf(0, line_height*1, id(mono_med), Color::BLACK, "MAC: %s", id(wifi_mac).state.c_str());
          it.printf(0, line_height*2, id(mono_med), Color::BLACK, "SSID: %s", id(wifi_ssid).state.c_str());
          it.printf(0, line_height*3, id(mono_med), Color::BLACK, "Signal strength: %.0f%%", id(wifi_sig).state);
          it.printf(0, line_height*3, id(mono_med), Color::BLACK, "Signal strength: %.0f%%", id(wifi_sig).state);
          it.printf(0, line_height*4, id(mono_med), Color::BLACK, "Pass  %s", id(ap_password));
          if (id(draw_hold)) id(draw_hold)(it);
      - id: page_info
        lambda: |-
          const int line_height = 15;
          char dns[network::IP_ADDRESS_BUFFER_SIZE];
          const std::string &ip = id(wifi_ip_addr).state;
          it.printf(0, 0, id(mono_med), Color::BLACK, "ID:  %s", App.get_name().c_str());
          it.printf(0, line_height*1, id(mono_med), Color::BLACK, "IP:  %s", ip.empty() ? "-" : ip.c_str());
          for (int i = 0; i < 2; i++)
          {
            id(wifi_id).get_dns_address(i).str_to(dns);
            it.printf(0, line_height*(2+i), id(mono_med), Color::BLACK, "DNS%d %s", i+1, dns);
          }
          if (id(draw_hold)) id(draw_hold)(it);
      - id: page_updating 
        lambda: |-
          it.print(250/2, 122/2, id(literata_b), Color::BLACK, TextAlign::CENTER, "Updating");
      - id: page_wifi_forgotten
        lambda: |-
          it.print(250/2, 122/2 - 12, id(literata_med_b), Color::BLACK, TextAlign::CENTER, "Wifi forgotten");
          it.print(250/2, 122/2 + 14, id(mono_med), Color::BLACK, TextAlign::CENTER, "Restarting...");
      - id: page_update_failed
        lambda: |-
          it.print(250/2, 122/2, id(literata_b), Color::BLACK, TextAlign::CENTER, "Update Failed");
    on_page_change:
      then:
        - script.execute: refresh_display  # Partial update; the full refresh comes once the user is idle
        - script.execute: full_refresh_when_idle

## Board and project config

# The 2.13in-v3 display model in epaper_spi needs a one-line fix (base_image_required, esphome/esphome#22959)
# that is not in a release yet; without it partial refreshes come out grey. Pinned to the PR's commit.
# Remove this block (and bump esphome-version / min_version) once the fix ships in an ESPHome release.
external_components:
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: c4155f3b286868a848bb51556b45d2ce6bbdc20b
      path: esphome/components
    components: [epaper_spi]

esp32:
  board: m5stack-core-esp32-16M
  flash_size: 16MB
  framework:
    type: esp-idf

dashboard_import:
  package_import_url: "github://Duckle29/InKli/esphome/${entry_file}@${version}"
  import_full_config: false

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

  min_version: 2026.11.0  # epaper_spi; panasonic_ir for the heat pump variant

  project:
    name: "${project_name}"
    version: "${version}"

  on_boot:
    - priority: 900
      then:
        - lambda: |-
            for (int i=0; i<8; i++)
            {
              uint32_t rand_val = esp_random();

              uint8_t min_num, max_num;
              switch (rand_val % 3)
              {
                case 0:
                  min_num = '0';
                  max_num = '9';
                  break;
                case 1:
                  min_num = 'A';
                  max_num = 'Z';
                  break;
                case 2:
                default:
                  min_num = 'a';
                  max_num = 'z';
                  break;
              }

              uint8_t num = (rand_val % ((max_num-min_num) +1)) + min_num;
              if (num == 'l') { num = '2'; } // l and 1 are hard to tell apart. Only 2 instead
              id(ap_password)[i] = num;
            }
    - priority: 600
      then: 
        - lambda: |-
            // Set display page loop order
            /*
                             |-> Co2 -> Temp -> Humi
                             |    |______<______|
              page_wifi_info-|

              ap_info -> page_setup -> page_info
                |______________<____________|

              >page_updating<

            */

            id(page_wifi_info).set_next(id(page_co2_graph));

            id(ap_info).set_next(id(page_setup));
            id(page_setup).set_next(id(page_info));
            id(page_info).set_next(id(ap_info));

            id(page_co2_graph).set_next(id(page_t_graph));
            id(page_t_graph).set_next(id(page_rh_graph));
            id(page_rh_graph).set_next(id(page_co2_graph));

            id(page_updating).set_next(id(page_updating));

        # Hold-progress bar. Bar fills over 6s. Ticks: 2s = Wi-Fi setup toggle, 4s = forget wifi (config screen while connected), 6s (end of bar) = firmware update.
        # Keep these in sync with the min_length values of the btn on_click handlers.
        - lambda: |-
            id(draw_hold) = [](esphome::display::Display &it) {
              if (id(btn_press_ms) == 0) return;
              const uint32_t held = millis() - id(btn_press_ms);
              if (held < 500) return;  // Plain clicks shouldn't flash a bar

              const uint32_t setup_ms = 2000, forget_ms = 4000, update_ms = 6000;
              const int w = it.get_width();
              const int box_h = 34;
              const int y0 = it.get_height() - box_h;
              const int bar_x = 4, bar_w = w - 8, bar_y = y0 + 21, bar_h = 8;
              const int tick_x = bar_x + (int) (bar_w * (float) setup_ms / update_ms);
              const int forget_x = bar_x + (int) (bar_w * (float) forget_ms / update_ms);

              it.filled_rectangle(0, y0, w, box_h, Color::WHITE);
              it.rectangle(0, y0, w, box_h, Color::BLACK);

              // Labels sit above the bar: the 2s action over its tick, "update" at the end.
              // On the setup screens the 2s action leaves setup, so say where it goes.
              auto *page = id(disp).get_active_page();
              const bool in_setup = page == id(ap_info) || page == id(page_setup) || page == id(page_info);
              // Config screen while on wifi: the 4s step forgets the wifi credentials
              const bool can_forget = page == id(ap_info) && id(wifi_id).is_connected();
              it.print(tick_x, y0 + 3, id(mono_smol), Color::BLACK, TextAlign::TOP_CENTER, in_setup ? "sensors" : "setup");
              // No "update" label on the forget screen: it would sit right next to "forget wifi"
              if (can_forget) it.print(forget_x, y0 + 3, id(mono_smol), Color::BLACK, TextAlign::TOP_CENTER, "forget wifi");
              else it.print(bar_x + bar_w, y0 + 3, id(mono_smol), Color::BLACK, TextAlign::TOP_RIGHT, "update");

              it.rectangle(bar_x, bar_y, bar_w, bar_h, Color::BLACK);
              const int fill = (int) ((bar_w - 2) * (float) std::min<uint32_t>(held, update_ms) / update_ms);
              it.filled_rectangle(bar_x + 1, bar_y + 1, fill, bar_h - 2, Color::BLACK);
              // Tick at the setup threshold, reaching up to its label
              it.line(tick_x, bar_y - 4, tick_x, bar_y + bar_h - 1, Color::BLACK);
              if (can_forget) it.line(forget_x, bar_y - 4, forget_x, bar_y + bar_h - 1, Color::BLACK);
            };

    - priority: 300
      then: 
        - lambda: |-
            ESP_LOGD("AP_RAND_PASS", "%s", id(ap_password));
            auto ap = id(wifi_id).get_ap();
            std::string pass(id(ap_password), sizeof(id(ap_password)));
            ap.set_ssid("InKli Config");
            ap.set_password(pass);
            id(wifi_id).set_ap(ap);
            // No stored wifi (never set up, or forgotten): the fallback AP comes up after ap_timeout of
            // not being connected, 90 s by default. Nobody wants to wait that long to set the device up.
            if (id(wifi_id).get_sta().get_ssid().empty()) id(wifi_id).set_ap_timeout(5000);
    - priority: -100
      then:
        - lambda: id(scd30_ready) = true;
        - script.execute: apply_temp_offset
        # The SCD30 driver always turns automatic calibration on in its own setup(); put the stored choice back
        - script.execute:
            id: apply_asc
            enable: !lambda return id(asc_switch).state;
    - priority: -300
      then:
        - delay: 5min
        - if:
            condition:
              wifi.connected:
            else:
              wifi.disable:

globals:
  # Set at the end of boot; apply_asc does nothing before that
  - id: scd30_ready
    type: bool
    initial_value: "false"

  - id: ap_password
    type: char[9]

  # Button hold tracking (0 = not pressed), used for the hold-progress bar
  - id: btn_press_ms
    type: uint32_t
    initial_value: "0"
  - id: btn_held_for_ms
    type: uint32_t
    initial_value: "0"

  # Draws the hold-progress bar over whatever page is showing. Assigned in
  # on_boot; every page lambda calls it last. (Display lambdas and page
  # lambdas are mutually exclusive, so there's no global overlay hook.)
  - id: draw_hold
    type: std::function<void(esphome::display::Display &)>

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

i2c:
  - id: i2c_scd30
    sda: GPIO21
    scl: GPIO22
    scan: False
  
  - id: qwiic
    sda: GPIO26
    scl: GPIO27
    scan: True

http_request:
  verify_ssl: True
  # TLS assumes 16 KiB buffers by default. Some servers support MFLN to negotiate smaller buffers, but lets not rely on it
  buffer_size_rx: 4096
  
# debug:
#   update_interval: 5s

ota:
  - platform: http_request
  - platform: esphome
    # on_begin:
    #   then:
    #     - display.page.show: page_updating
    #     - delay: 1s

captive_portal:

esp32_improv:
  authorizer: btn

improv_serial:

# Enable Home Assistant API
api:
  reboot_timeout: 0s

wifi:
  id: wifi_id
  on_connect:
    - display.page.show: page_co2_graph
    - script.execute: apply_temp_offset
  on_disconnect:
    - script.execute: apply_temp_offset
  ap:
  reboot_timeout: 0s
